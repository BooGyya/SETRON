[project]
name = "setron"
version = "0.1.0"
description = "설비 소프트웨어 버전 및 Release Item 관리 프로그램"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6",
    "SQLAlchemy",
    "PyMySQL[rsa]",
    "pandas",
    "openpyxl",
    "xlwings",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
setron = ["ui/assets/*.png", "ui/assets/*.svg", "ui/assets/*.txt", "ui/assets/fonts/*.ttf", "ui/assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
